<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0}</style></head><body>
<title>財金系辦公室 E503 探索・生動版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a shallow 3/4-view cartoon office (canvas) built from the real E503 seating plan; a dashed route leads from the door to each staff seat.
   Roster with directions below. Single committed light look. */
:root{
  --bg:#f2f4f7; --paper:#ffffff; --ink:#1d2b36; --muted:#5d6b74; --line:#dde3ea;
  --mcu:#1f55a8; --gold:#e9a92a; --route:#e2574c;
  --f-display:"LXGW WenKai TC","Kaiti TC","STKaiti",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1600px;margin:0 auto;padding-block:14px 12px;height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 24px;margin-bottom:10px;flex:none}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.16em;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,3.4vw,42px);line-height:1.1;margin:2px 0 4px;letter-spacing:.04em}
h1 .room{font-family:var(--f-mono);font-size:.5em;font-weight:500;color:#fff;background:var(--mcu);border-radius:6px;padding:2px 10px;vertical-align:middle;margin-left:10px;letter-spacing:.06em}
.lede{margin:0;color:var(--muted);font-size:15px;max-width:44em}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
.tools{display:flex;gap:8px}
button{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font:500 13.5px var(--f-body);cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.stage{position:relative;border-radius:14px;overflow:hidden;height:100%;min-height:340px;background:#e9e4da;box-shadow:0 2px 0 var(--line),0 10px 30px rgba(29,43,54,.08)}
.stage>canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}
.envbar{position:absolute;left:12px;bottom:12px;z-index:2;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:rgba(255,255,255,.92);border-radius:999px;padding:4px 6px 4px 12px;font-size:12.5px;max-width:calc(100% - 24px)}
.envbar button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer}
.envbar button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.hint{position:absolute;left:12px;top:10px;background:rgba(255,255,255,.92);border-radius:999px;padding:4px 12px;font-size:13px;pointer-events:none}
.card{position:relative;background:#fff;border:2px solid var(--mcu);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.55;box-shadow:0 6px 18px rgba(31,85,168,.14);grid-column:1/-1}
.card .top{display:flex;gap:12px;align-items:center}
.card canvas{border-radius:50%;background:#eaf3fb;flex:none}
.card .role{font:500 12px var(--f-mono);letter-spacing:.06em;color:var(--mcu)}
.card .nm{font:700 22px/1.2 var(--f-display);letter-spacing:.06em}
.card .way{margin:8px 0 0;background:#fff3f1;border-left:3px solid var(--route);padding:6px 10px;border-radius:0 6px 6px 0;font-size:13.5px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:10px 0 0}
.card dt{color:var(--muted)}
.card dd{margin:0;word-break:break-all;user-select:text;font-variant-numeric:tabular-nums}
.card .x{position:absolute;top:6px;right:8px;border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--muted);padding:4px}
.card .cp{margin-top:10px;border:1px solid var(--mcu);color:var(--mcu);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.card .cp:hover{background:var(--mcu);color:#fff}

section.roster{display:flex;flex-direction:column;min-height:0;overflow:auto;padding-right:2px}
section.roster h2{font-family:var(--f-display);font-size:24px;margin:0 0 2px}
section.roster p.lead{margin:0 0 10px;color:var(--muted);font-size:13px}
.cards{display:flex;flex-direction:column;gap:8px}
.pc{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer}
.pc:hover,.pc.on{border-color:var(--mcu);box-shadow:0 0 0 2px var(--mcu) inset}
.pc canvas{border-radius:50%;background:#eaf3fb}
.pc b{display:block;font-family:var(--f-display);font-size:18px;letter-spacing:.04em}
.pc.on{display:none}
.pc small{display:block;color:var(--muted);font-size:13px;line-height:1.5}
.pc .go{color:var(--route);font-weight:500}
footer{margin-top:auto;padding-top:12px;font-size:11.5px;line-height:1.5;color:var(--muted);display:flex;flex-direction:column;gap:2px}
footer a{color:var(--ink)}
@media (max-width:860px),(max-height:560px){
  .wrap{height:auto;display:block}
  .main{display:block}
  .stage{height:58vh;height:58svh}
  .stage:has(#creator:not([hidden])){height:88vh;height:88svh}
  section.roster{margin-top:16px;overflow:visible}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
}
@media (max-width:640px){.hint{display:none}}
#gl{position:absolute;inset:0}#gl canvas{display:block;width:100%!important;height:100%!important;touch-action:none;cursor:grab}
#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag3{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:#fff;color:#1d2b36;font:700 14px/1 system-ui,sans-serif;padding:5px 10px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.18);white-space:nowrap;pointer-events:auto;cursor:pointer}
.tag3.on{background:#1f55a8;color:#fff;font-size:16px}
.tag3.here{background:#1d2b36;color:#fff;pointer-events:none}
#nogl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:#1d2b36;background:#eef4f0}
#nogl[hidden]{display:none}
.ptimg{border-radius:50%;background:#eaf3fb;flex:none}
.enterBtn{position:absolute;right:12px;bottom:12px;z-index:2;border:0;background:var(--mcu);color:#fff;border-radius:999px;padding:9px 18px;font:700 14px var(--f-body);box-shadow:0 6px 16px rgba(31,85,168,.35);cursor:pointer}
.enterBtn:hover{background:#17468e}
.exbar{position:absolute;right:12px;bottom:12px;z-index:2;display:flex;gap:6px}
.exbar button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:500 13px var(--f-body);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.exbar button:hover{border-color:var(--ink)}
.talk{position:absolute;left:0;top:0;z-index:3;transform:translate(-50%,-100%);background:var(--gold);color:#1d2b36;border:0;border-radius:999px;padding:6px 12px;font:700 13px var(--f-body);box-shadow:0 4px 12px rgba(0,0,0,.2);cursor:pointer;white-space:nowrap}
.tag3.me{background:#f2c165;color:#1d2b36;pointer-events:none;border:2px solid #fff}
#creator{position:absolute;inset:0;z-index:5;display:grid;grid-template-columns:minmax(0,1fr) minmax(290px,370px);background:#f4ecdf}
#creator[hidden]{display:none}
.cr-prev{position:relative;min-height:0;overflow:hidden;background:radial-gradient(circle at 50% 64%,#fff 0 26%,#f4ecdf 62%)}
.cr-prev canvas{position:absolute;inset:0;display:block;cursor:grab;touch-action:none}
.cr-prev .tag3{left:50%;top:9%;transform:translate(-50%,0);font-size:16px;z-index:1}
.cr-tip{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:12px;color:var(--muted);background:rgba(255,255,255,.85);border-radius:999px;padding:3px 10px;pointer-events:none}
.cr-panel{overflow:auto;padding:16px 16px 14px;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:11px}
.cr-panel h3{font:700 22px/1.2 var(--f-display);margin:0;letter-spacing:.04em}
.cr-sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.cr-lab{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.cr-name{width:100%;font:500 16px var(--f-body);padding:8px 12px;border:1px solid var(--line);border-radius:10px;color:var(--ink)}
.cr-name:focus{outline:2px solid var(--mcu);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #c9d1da;cursor:pointer;padding:0}
.sw.none{background:repeating-linear-gradient(45deg,#fff 0 4px,#e3e8ee 4px 8px)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--mcu)}
.cr-act{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;padding-top:6px}
.cr-go{flex:1;min-width:120px;border:0;background:var(--mcu);color:#fff;border-radius:999px;padding:10px 16px;font:700 15px var(--f-body);cursor:pointer}
.cr-sec{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-size:14px;cursor:pointer}
@media (max-width:640px){#creator{grid-template-columns:1fr;grid-template-rows:38% 62%}.cr-panel{border-left:0;border-top:1px solid var(--line)}}
/* 詢問面板 */
.ask{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:4;width:min(380px,calc(100% - 24px));background:#fff;border:2px solid var(--mcu);border-radius:14px;padding:10px 34px 11px 12px;box-shadow:0 8px 22px rgba(31,85,168,.22)}
.ask label{display:block;font:700 14px var(--f-body);margin:0 0 6px}
.ask select{width:100%;font:500 15px var(--f-body);padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.ask select:focus{outline:2px solid var(--mcu);outline-offset:1px}
.ask .ans{margin-top:8px;padding:7px 10px;background:#eef4fc;border-left:3px solid var(--mcu);border-radius:0 8px 8px 0;font:500 14px/1.5 var(--f-body);white-space:pre-line}
.ask .ans.ok{background:#e9f7ef;border-left-color:#2f9e6a}
.ask .go{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ask .go:empty{display:none}
.ask .go button{border:1px solid var(--mcu);color:var(--mcu);background:#fff;border-radius:999px;padding:4px 12px;font:500 13px var(--f-body);cursor:pointer}
.ask .go button:hover{background:var(--mcu);color:#fff}
.ask .x{position:absolute;top:4px;right:6px;border:0;background:none;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;padding:4px 6px}
@media (min-width:861px){.ask{left:12px;top:10px;transform:none;width:330px}}
@media (max-width:640px){.ask{top:auto;bottom:10px}}
/* 生動版：對話泡泡與搖桿 */
.bub{position:absolute;left:0;top:0;z-index:2;transform:translate(-50%,-100%);width:max-content;max-width:210px;background:#fff;color:var(--ink);border-radius:14px;padding:6px 12px;font:500 13.5px/1.4 var(--f-body);box-shadow:0 4px 14px rgba(29,43,54,.24);pointer-events:none;text-align:center;transition:opacity .25s}
.bub::after{content:"";position:absolute;left:50%;bottom:-5px;width:11px;height:11px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:2px}
.bub.me{background:#fff3d6}
.bub.in{animation:bubIn .28s cubic-bezier(.3,1.5,.5,1)}
.bub.out{opacity:0}
@keyframes bubIn{from{transform:translate(-50%,-80%) scale(.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.bub.in{animation:none}}
.joy{position:absolute;left:14px;bottom:84px;z-index:3;width:104px;height:104px;border-radius:50%;background:rgba(255,255,255,.5);border:2px solid rgba(255,255,255,.9);box-shadow:0 4px 14px rgba(0,0,0,.18);touch-action:none}
@media (max-width:640px){.exbar{bottom:auto;top:10px}}
.joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--mcu);opacity:.85;pointer-events:none}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">MING CHUAN UNIVERSITY · DEPARTMENT OF FINANCE</div>
      <h1>財金系辦公室<span class="room">E503</span></h1>
      <p class="lede">要找哪位同仁？點名片或辦公室裡的人，地上的路線會從大門帶你走到他的座位；也可以建立自己的角色，走進辦公室跟大家打招呼。</p>
    </div>
    <div class="tools">
      <button class="btn" id="sndBtn" type="button" aria-pressed="false">音效</button>
      <button class="btn" id="tagBtn" type="button" aria-pressed="true">名牌</button>
      <button class="btn" id="playBtn" type="button" aria-pressed="false">暫停</button>
      <button class="btn" id="viewBtn" type="button" aria-pressed="false">鳥瞰</button>
      <button class="btn" id="homeBtn" type="button">回門口</button>
    </div>
  </header>

  <div class="main">
  <div class="stage" id="stage">
    <div id="gl" role="img" aria-label="E503 財金系辦公室的立體卡通場景，五位同仁坐在各自座位，點人物會顯示從大門到座位的路線"></div><div id="tags"></div><div id="nogl" hidden>你的瀏覽器不支援 3D 顯示，請直接點下方名片查看同仁資料。</div>
    <div class="envbar" id="envbar"><span id="envTxt">士林</span><button id="tBtn" type="button" aria-pressed="false" title="預覽不同時段的窗景">時間：現在</button><button id="wBtn" type="button" aria-pressed="false" title="預覽不同天氣">天氣：自動</button></div>
    <button class="enterBtn" id="enterBtn" type="button">建立角色・走進辦公室</button>
    <div class="exbar" id="exbar" hidden><button id="waveBtn" type="button">揮手</button><button id="restyleBtn" type="button">換造型</button><button id="leaveBtn" type="button">離開辦公室</button></div>
    <button class="talk" id="talkBtn" type="button" hidden></button>
    <div class="joy" id="joy" hidden aria-hidden="true"><i></i></div>
    <div class="ask" id="ask" hidden role="region" aria-label="詢問同仁"><button class="x" id="askX" type="button" aria-label="關閉">×</button><label for="askSel" id="askLab">有什麼需要幫忙的嗎？</label><select id="askSel"></select><div class="ans" id="askAns" aria-live="polite" hidden></div><div class="go" id="askGo"></div></div>
    <div id="creator" hidden role="dialog" aria-label="建立你的角色"><div class="cr-prev" id="crPrev"><div class="tag3 me" id="crTag">同學</div><span class="cr-tip">拖曳可轉動角色</span></div><div class="cr-panel" id="crPanel"></div></div>
    <div class="hint" id="hint">點人物或名片，跟著地上的路線找到他；拖曳可左右張望、滾輪可前後移動</div>
  </div>

  <section class="roster">
    <h2>找同仁</h2>
    <p class="lead">點名片看怎麼走和聯絡方式。</p>
    <div class="cards" id="cards"><div class="card" id="card" hidden role="region" aria-live="polite"></div></div>
    <footer>
      <span>資料來源：<a href="https://fin.mcu.edu.tw/%E8%A1%8C%E6%94%BF%E4%BA%BA%E5%93%A1/" target="_blank" rel="noopener">銘傳大學財務金融學系・行政人員</a></span>
      <span>人物與擺設為卡通示意，座位依實際配置繪製。</span>
    </footer>
  </section>
  </div>
</div>

<script>
const STAFF=[
  {id:'hou',role:'所秘書',name:'侯信安',edu:'銘傳大學國企所碩士',tel:'(02) 2882-4564 分機 8027',fax:'(02) 2880-9730',mail:'sahou@mail.mcu.edu.tw',
    look:{hair:'hou',hairC:'#1d1a19',skin:'#efc6a3',glasses:true,mouth:'smile',outfit:'suit',shirt:'#2a3140',tie:'#3d5fa8',pants:'#2a2f3a',shoes:'#2b201a'},mode:'walk'},
  {id:'chen',role:'系秘書',name:'陳俐靜',edu:'銘傳大學財金所碩士',tel:'(02) 2882-4564 分機 2383',fax:'(02) 2880-9769',mail:'sheila@mail.mcu.edu.tw',
    look:{hair:'chen',hairC:'#3e2a1f',skin:'#f6d5bd',mouth:'smile',outfit:'cardi',shirt:'#1f2a44',pants:'#2b2f3a',shoes:'#2b201a'},mode:'walk'},
  {id:'zhou',role:'約聘辦事員',name:'周怡忻',edu:'銘傳大學財金所碩士',tel:'(02) 2882-4564 分機 2386',fax:'(02) 2880-9769',mail:'yihsin@mail.mcu.edu.tw',

/* ════════ 座位與路線（平面座標，依 E503 配置圖） ════════ */
const SEAT={
  chen:{x:78,y:26,face:'down',side:[[185,30],[185,102]],way:'進門後沿右側走道往裡走，在第二個路口左轉，走到底：右手邊最後一個座位。'},

  tsai:{x:62,y:172,face:'right',side:[[62,102]],way:'進門後沿右側走道往裡走，在第二個路口左轉，走到底：左手邊最後一個座位。'},
  hou:{x:62,y:276,face:'right',side:[[22,290],[22,375]],way:'進門後立刻左轉，沿靠門的走道走到底，先經過會議桌：右手邊最裡面的座位。'}

const EDGES=[['Ht','Hc'],['Hc','Hz'],['Hz','J1'],['J1','cp'],['cp','wt'],['wt','J2'],['J2','door'],['J2','Bm'],['Bm','Bh'],['cp','copier'],['wt','water'],['Bm','meet'],['door','out']];

function lerpAng(a,b,k){let d=((b-a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;return a+d*k}
function pose(o,m,seated,moving,wave,dt,faceCam){const [x,z]=W([o.x,o.y]);let target=o.tr??o.rot??0;
  if(seated){const f=SEAT[o.id].face;target=f==='down'?0:Math.PI/2;m.root.position.set(x-(f==='right'?.55:0),.45,z-(f==='down'?.55:0))}
  else m.root.position.set(x,0,z);
  if(faceCam){if(faceCam.length){const dx=faceCam[0]*S-x,dz=faceCam[1]*S-z,L=Math.hypot(dx,dz)||1;target=Math.atan2(dx/L+Math.sin(camT.az)*.85,dz/L+Math.cos(camT.az)*.85)}else target=Math.atan2(camera.position.x-x,camera.position.z-z)}
  o.rot=lerpAng(o.rot??target,target,Math.min(1,dt*8));m.root.rotation.y=o.rot;
  const sw=moving&&!reduce?Math.sin(o.phase):0;o.mv=(o.mv||0)+((moving?1:0)-(o.mv||0))*Math.min(1,dt*9);
  m.rig.position.y=moving?Math.abs(Math.cos(o.phase))*.2:0;m.rig.rotation.x=reduce?0:o.mv*.09;m.rig.rotation.z=sw*.04*o.mv;
  if(seated){m.legs.forEach(l=>l.rotation.x=-Math.PI/2+.15);m.arms.forEach((a,i)=>{a.rotation.x=-.9;a.rotation.z=(i?1:-1)*.12})}
  else{m.legs[0].rotation.x=sw*.55;m.legs[1].rotation.x=-sw*.55;m.arms[0].rotation.x=-sw*.5;m.arms[1].rotation.x=sw*.5;m.arms[0].rotation.z=-.18;m.arms[1].rotation.z=.18}
  let hx=0,hy=0;const hi=o.hi>0;
  const acting=seated&&!wave&&!hi&&o.act&&!reduce;if(o.cup)o.cup.visible=acting&&o.act==='sip';

  if(ME.on&&ME.o){const [x,z]=W([ME.o.x,ME.o.y]);if(openP){const [px,pz]=W([openP.x,openP.y]);camT.tx=(x+px)/2;camT.ty=4.3;camT.tz=(z+pz)/2}else{camT.tx=x;camT.ty=3.6;camT.tz=z}}
  else if(VIEW==='in'&&openP&&ROUTE.pts){if(ROUTE.t<1){Object.assign(camT,{tx:headDot.position.x,ty:4,tz:headDot.position.z,dist:28,pol:1.08});camT.az+=(.35-camT.az)*k;ROUTE.fol=1}else if(ROUTE.fol){ROUTE.fol=0;focusOn(openP)}}
  else if(VIEW==='aer'&&openP&&openP.state!=='seat'){const r=openP.m.root.position;camT.tx=r.x+2;camT.tz=r.z+2}
  applyCam();
  const occB=VIEW!=='in'?null:ME.on&&ME.m?new THREE.Vector3(ME.m.root.position.x,5.5,ME.m.root.position.z):openP?new THREE.Vector3(...headPos(openP)):null;
  if(occB){const A=camera.position,B=occB,AB=B.clone().sub(A),L2=AB.lengthSq();
    for(const q of P){if(q===openP){q.m.root.visible=true;continue}const H=new THREE.Vector3(...headPos(q)),t=H.clone().sub(A).dot(AB)/L2;
      const d=t>0&&t<.93?H.distanceTo(A.clone().addScaledVector(AB,t)):99;q.m.root.visible=d>4.6}
    for(const g of LAMPS){const H=g.position.clone().setY(WALLH-3),t=H.clone().sub(A).dot(AB)/L2;g.visible=!(t>0&&t<.95&&H.distanceTo(A.clone().addScaledVector(AB,t))<3.4)}}
  else if(P.some(q=>!q.m.root.visible)||LAMPS.some(g=>!g.visible&&VIEW==='in')){P.forEach(q=>q.m.root.visible=true);if(VIEW==='in')LAMPS.forEach(g=>g.visible=true)}
  for(const p of P){const seated=p.state==='seat'&&!(p===openP||p.wave>0),mov=p.state==='walk'&&playing;
    pose(p,p.m,seated,mov,(p===openP&&!ME.on)||p.wave>0,dt,p===openP&&p.state==='seat'&&(ME.on&&ME.o?[ME.o.x,ME.o.y]:true));
    p.m.face.material=p.blinkT<0?p.m.fClosed:(p.wave>0||p.hi>0||p===openP)?p.m.fHappy:p.m.fOpen}
  for(const v of VIS){pose(v,v.m,false,v.state==='walk'&&playing,false,dt,false);v.m.face.material=v.state==='talk'?v.m.fHappy:v.m.fOpen}
  BULBS.forEach((b,i)=>b.visible=(Math.floor(now/450)+i)%3!==0);liveFrame(dt);
  routeTick();if(renderer)renderer.render(scene,camera);placeOverlays();meOverlay();bubOverlay();requestAnimationFrame(loop)}
resize();requestAnimationFrame(loop);

</script>
