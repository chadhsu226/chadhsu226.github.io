<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0}</style></head><body>
<title>財金系辦公室 E503 室內</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a shallow 3/4-view cartoon office (canvas) built from the real E503 seating plan; a dashed route leads from the door to each staff seat.
   Roster with directions below. Single committed light look. */
:root{
  --bg:#f2f4f7; --paper:#ffffff; --ink:#1d2b36; --muted:#5d6b74; --line:#dde3ea;
  --mcu:#1f55a8; --gold:#e9a92a; --route:#e2574c;
  --f-display:"LXGW WenKai TC","Kaiti TC","STKaiti",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1600px;margin:0 auto;padding-block:14px 12px;height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 24px;margin-bottom:10px;flex:none}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.16em;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,3.4vw,42px);line-height:1.1;margin:2px 0 4px;letter-spacing:.04em}
h1 .room{font-family:var(--f-mono);font-size:.5em;font-weight:500;color:#fff;background:var(--mcu);border-radius:6px;padding:2px 10px;vertical-align:middle;margin-left:10px;letter-spacing:.06em}
.lede{margin:0;color:var(--muted);font-size:15px;max-width:44em}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
.tools{display:flex;gap:8px}
button{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font:500 13.5px var(--f-body);cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.stage{position:relative;border-radius:14px;overflow:hidden;height:100%;min-height:340px;background:#e9e4da;box-shadow:0 2px 0 var(--line),0 10px 30px rgba(29,43,54,.08)}
.stage>canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}
.envbar{position:absolute;left:12px;bottom:12px;z-index:2;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:rgba(255,255,255,.92);border-radius:999px;padding:4px 6px 4px 12px;font-size:12.5px;max-width:calc(100% - 24px)}
.envbar button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer}
.envbar button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.hint{position:absolute;left:12px;top:10px;background:rgba(255,255,255,.92);border-radius:999px;padding:4px 12px;font-size:13px;pointer-events:none}
.card{position:relative;background:#fff;border:2px solid var(--mcu);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.55;box-shadow:0 6px 18px rgba(31,85,168,.14);grid-column:1/-1}
.card .top{display:flex;gap:12px;align-items:center}
.card canvas{border-radius:50%;background:#eaf3fb;flex:none}
.card .role{font:500 12px var(--f-mono);letter-spacing:.06em;color:var(--mcu)}
.card .nm{font:700 22px/1.2 var(--f-display);letter-spacing:.06em}
.card .way{margin:8px 0 0;background:#fff3f1;border-left:3px solid var(--route);padding:6px 10px;border-radius:0 6px 6px 0;font-size:13.5px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:10px 0 0}
.card dt{color:var(--muted)}
.card dd{margin:0;word-break:break-all;user-select:text;font-variant-numeric:tabular-nums}
.card .x{position:absolute;top:6px;right:8px;border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--muted);padding:4px}
.card .cp{margin-top:10px;border:1px solid var(--mcu);color:var(--mcu);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.card .cp:hover{background:var(--mcu);color:#fff}

section.roster{display:flex;flex-direction:column;min-height:0;overflow:auto;padding-right:2px}
section.roster h2{font-family:var(--f-display);font-size:24px;margin:0 0 2px}
section.roster p.lead{margin:0 0 10px;color:var(--muted);font-size:13px}
.cards{display:flex;flex-direction:column;gap:8px}
.pc{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer}
.pc:hover,.pc.on{border-color:var(--mcu);box-shadow:0 0 0 2px var(--mcu) inset}
.pc canvas{border-radius:50%;background:#eaf3fb}
.pc b{display:block;font-family:var(--f-display);font-size:18px;letter-spacing:.04em}
.pc.on{display:none}
.pc small{display:block;color:var(--muted);font-size:13px;line-height:1.5}
.pc .go{color:var(--route);font-weight:500}
footer{margin-top:auto;padding-top:12px;font-size:11.5px;line-height:1.5;color:var(--muted);display:flex;flex-direction:column;gap:2px}
footer a{color:var(--ink)}
@media (max-width:860px),(max-height:560px){
  .wrap{height:auto;display:block}
  .main{display:block}
  .stage{height:58vh;height:58svh}
  section.roster{margin-top:16px;overflow:visible}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
}
@media (max-width:640px){.hint{display:none}}
#gl{position:absolute;inset:0}#gl canvas{display:block;width:100%!important;height:100%!important;touch-action:none;cursor:grab}
#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag3{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:#fff;color:#1d2b36;font:700 14px/1 system-ui,sans-serif;padding:5px 10px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.18);white-space:nowrap;pointer-events:auto;cursor:pointer}
.tag3.on{background:#1f55a8;color:#fff;font-size:16px}
.tag3.here{background:#1d2b36;color:#fff;pointer-events:none}
#nogl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:#1d2b36;background:#eef4f0}
#nogl[hidden]{display:none}
.ptimg{border-radius:50%;background:#eaf3fb;flex:none}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">MING CHUAN UNIVERSITY · DEPARTMENT OF FINANCE</div>
      <h1>財金系辦公室<span class="room">E503</span></h1>
      <p class="lede">要找哪位同仁？點名片或辦公室裡的人，地上的路線會從大門帶你走到他的座位。</p>
    </div>
    <div class="tools">
      <button class="btn" id="tagBtn" type="button" aria-pressed="true">名牌</button>
      <button class="btn" id="playBtn" type="button" aria-pressed="false">暫停</button>
      <button class="btn" id="viewBtn" type="button" aria-pressed="false">鳥瞰</button>
      <button class="btn" id="homeBtn" type="button">回門口</button>
    </div>
  </header>

  <div class="main">
  <div class="stage" id="stage">
    <div id="gl" role="img" aria-label="E503 財金系辦公室的立體卡通場景，五位同仁坐在各自座位，點人物會顯示從大門到座位的路線"></div><div id="tags"></div><div id="nogl" hidden>你的瀏覽器不支援 3D 顯示，請直接點下方名片查看同仁資料。</div>
    <div class="envbar" id="envbar"><span id="envTxt">士林</span><button id="tBtn" type="button" aria-pressed="false" title="預覽不同時段的窗景">時間：現在</button><button id="wBtn" type="button" aria-pressed="false" title="預覽不同天氣">天氣：自動</button></div>
    <div class="hint" id="hint">點人物或名片，跟著地上的路線找到他；拖曳可左右張望、滾輪可前後移動</div>
  </div>

  <section class="roster">
    <h2>找同仁</h2>
    <p class="lead">點名片看怎麼走和聯絡方式。</p>
    <div class="cards" id="cards"><div class="card" id="card" hidden role="region" aria-live="polite"></div></div>
    <footer>
      <span>資料來源：<a href="https://fin.mcu.edu.tw/%E8%A1%8C%E6%94%BF%E4%BA%BA%E5%93%A1/" target="_blank" rel="noopener">銘傳大學財務金融學系・行政人員</a></span>
      <span>人物與擺設為卡通示意，座位依實際配置繪製。</span>
    </footer>
  </section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const STAFF=[
  {id:'hou',role:'所秘書',name:'侯信安',edu:'銘傳大學國企所碩士',tel:'(02) 2882-4564 分機 8027',fax:'(02) 2880-9730',mail:'sahou@mail.mcu.edu.tw',
    look:{hair:'hou',hairC:'#1d1a19',skin:'#efc6a3',glasses:true,mouth:'smile',outfit:'suit',shirt:'#2a3140',tie:'#3d5fa8',pants:'#2a2f3a',shoes:'#2b201a'},mode:'walk'},
  {id:'chen',role:'系秘書',name:'陳俐靜',edu:'銘傳大學財金所碩士',tel:'(02) 2882-4564 分機 2383',fax:'(02) 2880-9769',mail:'sheila@mail.mcu.edu.tw',
    look:{hair:'chen',hairC:'#3e2a1f',skin:'#f6d5bd',mouth:'smile',outfit:'cardi',shirt:'#1f2a44',pants:'#2b2f3a',shoes:'#2b201a'},mode:'walk'},
  {id:'zhou',role:'約聘辦事員',name:'周怡忻',edu:'銘傳大學財金所碩士',tel:'(02) 2882-4564 分機 2386',fax:'(02) 2880-9769',mail:'yihsin@mail.mcu.edu.tw',
    look:{hair:'zhou',hairC:'#7b4a2b',skin:'#f7d8c1',mouth:'grin',outfit:'plain',shirt:'#2457c5',pants:'#3a4660',shoes:'#f2f2f2'},mode:'jog'},
  {id:'gao',role:'約聘辦事員',name:'高若綺',edu:'淡江大學企管所碩士',tel:'(02) 2882-4564 分機 2387',fax:'(02) 2880-9769',mail:'qyoroveoo@mail.mcu.edu.tw',
    look:{hair:'gao',hairC:'#121014',skin:'#f8dcc8',mouth:'grin',outfit:'collar',shirt:'#7cc6e8',pants:'#f2e6d0',shoes:'#ff8fab',clip:true,sparkle:true},mode:'walk'},
  {id:'tsai',role:'約聘辦事員',name:'蔡宇建',edu:'淡江大學經濟學系',tel:'(02) 2882-4564 分機 2385',fax:'(02) 2880-9769',mail:'mon820509@mail.mcu.edu.tw',
    look:{hair:'tsai',hairC:'#3b241a',hairHi:'#6f4630',skin:'#f4d3bc',mouth:'smile',lips:true,outfit:'knit',shirt:'#b9a8d2',pants:'#3c4458',shoes:'#f2f2f2'},mode:'jog'}
];
/* ════════ 座位與路線（平面座標，依 E503 配置圖） ════════ */
const SEAT={
  chen:{x:78,y:26,face:'down',side:[[185,30],[185,102]],way:'進門後沿右側走道往裡走，在第二個路口左轉，走到底：右手邊最後一個座位。'},
  zhou:{x:308,y:26,face:'down',side:[[414,30],[414,102]],way:'進門後沿右側走道往裡走，在第二個路口左轉：右手邊第一個座位。'},
  gao:{x:308,y:156,face:'down',side:[[414,156],[414,102]],way:'進門後沿右側走道往裡走，在第二個路口左轉：左手邊第一個座位。'},
  tsai:{x:62,y:172,face:'right',side:[[62,102]],way:'進門後沿右側走道往裡走，在第二個路口左轉，走到底：左手邊最後一個座位。'},
  hou:{x:62,y:276,face:'right',side:[[22,290],[22,375]],way:'進門後立刻左轉，沿靠門的走道走到底，先經過會議桌：右手邊最裡面的座位。'}
};
STAFF.forEach(d=>d.way=SEAT[d.id].way);
const NODES={Ht:[62,102],Hc:[185,102],Hz:[414,102],J1:[480,102],cp:[480,155],wt:[480,266],J2:[480,375],door:[480,404],Bm:[318,375],Bh:[22,375],
  copier:[496,155],water:[497,266],meet:[318,342],out:[480,470]};
const EDGES=[['Ht','Hc'],['Hc','Hz'],['Hz','J1'],['J1','cp'],['cp','wt'],['wt','J2'],['J2','door'],['J2','Bm'],['Bm','Bh'],['cp','copier'],['wt','water'],['Bm','meet'],['door','out']];
const EXIT={chen:'Hc',zhou:'Hz',gao:'Hz',tsai:'Ht',hou:'Bh'};
const ADJ={};for(const k in NODES)ADJ[k]=[];EDGES.forEach(([a,b])=>{const d=Math.hypot(NODES[a][0]-NODES[b][0],NODES[a][1]-NODES[b][1]);ADJ[a].push([b,d]);ADJ[b].push([a,d])});
function nodeRoute(a,b){const dist={},prev={},Q=new Set(Object.keys(NODES));for(const k in NODES)dist[k]=1e9;dist[a]=0;
  while(Q.size){let u=null;Q.forEach(k=>{if(u===null||dist[k]<dist[u])u=k});Q.delete(u);if(u===b)break;ADJ[u].forEach(([v,d])=>{if(dist[u]+d<dist[v]){dist[v]=dist[u]+d;prev[v]=u}})}
  const p=[b];while(p[0]!==a)p.unshift(prev[p[0]]);return p.map(k=>NODES[k].slice())}
const seatPt=id=>[SEAT[id].x,SEAT[id].y];
function pathSeatTo(id,node){const s=SEAT[id];return[seatPt(id),...s.side.map(p=>p.slice()),...nodeRoute(EXIT[id],node).slice(1)]}
function guidePath(id){const s=SEAT[id];return[...nodeRoute('door',EXIT[id]),...s.side.slice().reverse().slice(1).map(p=>p.slice()),s.side.length>1?s.side[0].slice():null].filter(Boolean)}


/* ════════ 3D 場景（Three.js） ════════ */
const S=.1,RW=53.4,RD=41,WALLH=16;
const stage=document.getElementById('stage'),host=document.getElementById('gl'),tagsBox=document.getElementById('tags');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});}catch(e){renderer=null}
if(!renderer){document.getElementById('nogl').hidden=false}
const scene=new THREE.Scene();scene.background=new THREE.Color('#efe8dc');
const camera=new THREE.PerspectiveCamera(30,16/10,1,600);
if(renderer){renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputEncoding=THREE.sRGBEncoding;host.appendChild(renderer.domElement)}
/* lights */
const hemi=new THREE.HemisphereLight('#fffaf0','#c9b49a',.75);scene.add(hemi);
const sun=new THREE.DirectionalLight('#fff3dd',.85);sun.position.set(60,80,40);sun.target.position.set(RW/2,0,RD/2);scene.add(sun,sun.target);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-45,right:45,top:45,bottom:-45,near:10,far:220});sun.shadow.bias=-.0006;sun.shadow.radius=4;
const fill=new THREE.DirectionalLight('#dfefff',.25);fill.position.set(-30,40,60);scene.add(fill);

/* helpers */
const MC={};function mat(c,o={}){const k=c+JSON.stringify(o);if(!MC[k])MC[k]=new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.82,metalness:0},o));return MC[k]}
const GC={};
function rboxGeo(w,h,d,r){const k=[w,h,d,r].join();if(GC[k])return GC[k];const b=Math.max(.01,Math.min(r,h/2-.005,w/2-.005,d/2-.005)),sw=w-2*b,sd=d-2*b,cr=Math.min(b,sw/2,sd/2)*.9;
  const sh=new THREE.Shape(),x=-sw/2,y=-sd/2;sh.moveTo(x+cr,y);sh.lineTo(x+sw-cr,y);sh.quadraticCurveTo(x+sw,y,x+sw,y+cr);sh.lineTo(x+sw,y+sd-cr);sh.quadraticCurveTo(x+sw,y+sd,x+sw-cr,y+sd);
  sh.lineTo(x+cr,y+sd);sh.quadraticCurveTo(x,y+sd,x,y+sd-cr);sh.lineTo(x,y+cr);sh.quadraticCurveTo(x,y,x+cr,y);
  const g=new THREE.ExtrudeGeometry(sh,{depth:Math.max(.001,h-2*b),bevelEnabled:true,bevelThickness:b,bevelSize:b,bevelSegments:3,curveSegments:5});g.rotateX(-Math.PI/2);g.translate(0,b,0);g.computeVertexNormals();return GC[k]=g}
function add(mesh,parent=scene,shadow=true){mesh.castShadow=shadow;mesh.receiveShadow=true;parent.add(mesh);return mesh}
function rbox(w,h,d,c,x,y,z,r=.2,parent){const m=new THREE.Mesh(rboxGeo(w,h,d,r),typeof c==='string'?mat(c):c);m.position.set(x,y,z);return add(m,parent)}
function cyl(rt,rb,h,c,x,y,z,seg=24,parent){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),typeof c==='string'?mat(c):c);m.position.set(x,y+h/2,z);return add(m,parent)}
function sph(r,c,x,y,z,parent,flat){const m=new THREE.Mesh(flat?new THREE.IcosahedronGeometry(r,1):new THREE.SphereGeometry(r,24,16),typeof c==='string'?mat(c,flat?{flatShading:true}:{}):c);m.position.set(x,y,z);return add(m,parent)}
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t}
function texPlane(w,h,tex,x,y,z,ry=0,rx=0,transparent=false){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshStandardMaterial({map:tex,roughness:.9,transparent}));m.position.set(x,y,z);m.rotation.set(rx,ry,0);m.receiveShadow=true;scene.add(m);return m}
const W=p=>[p[0]*S,p[1]*S];

/* ── floor & hallway ── */
const woodTex=canvasTex(512,512,(g,w,h)=>{g.fillStyle='#ecd2a6';g.fillRect(0,0,w,h);for(let i=0;i<8;i++){g.fillStyle=i%2?'#e8cc9d':'#efd7ae';g.fillRect(i*64,0,64,h)}
  g.strokeStyle='rgba(140,100,55,.28)';g.lineWidth=2;for(let i=0;i<=8;i++){g.beginPath();g.moveTo(i*64,0);g.lineTo(i*64,h);g.stroke()}
  for(let i=0;i<8;i++){const y=(i*157)%h;g.beginPath();g.moveTo(i*64,y);g.lineTo(i*64+64,y);g.stroke()}
  g.strokeStyle='rgba(160,120,70,.12)';g.lineWidth=1;for(let i=0;i<60;i++){const x=(i*83)%w,y=(i*197)%h;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+12,y+30,x,y+60);g.stroke()}});
woodTex.wrapS=woodTex.wrapT=THREE.RepeatWrapping;woodTex.repeat.set(RW/9,RD/9);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(RW,RD),new THREE.MeshStandardMaterial({map:woodTex,roughness:.85}));floor.rotation.x=-Math.PI/2;floor.position.set(RW/2,0,RD/2);floor.receiveShadow=true;scene.add(floor);
rbox(RW+.8,.5,RD+.8,'#c9a677',RW/2-.0,-.5,RD/2,.1);
const tileTex=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#e9e4da';g.fillRect(0,0,w,h);g.strokeStyle='rgba(120,110,95,.25)';g.lineWidth=3;for(let i=0;i<=4;i++){g.beginPath();g.moveTo(i*64,0);g.lineTo(i*64,h);g.stroke();g.beginPath();g.moveTo(0,i*64);g.lineTo(w,i*64);g.stroke()}});
tileTex.wrapS=tileTex.wrapT=THREE.RepeatWrapping;tileTex.repeat.set((RW+6)/6,9/6);
const hall=new THREE.Mesh(new THREE.PlaneGeometry(RW+6,9),new THREE.MeshStandardMaterial({map:tileTex,roughness:.9}));hall.rotation.x=-Math.PI/2;hall.position.set(RW/2+2.2,-.05,RD+4.9);hall.receiveShadow=true;scene.add(hall);
rbox(RW+6,1.4,9,'#cfc6b6',RW/2+2.2,-1.45,RD+4.9,.15);rbox(RW+2.2,1.4,RD+1.6,'#b98f5e',RW/2-.2,-1.6,RD/2,.15);

/* ── walls ── */
const MINT='#d4ece1',MINT2='#bad9cb',TRIM='#f2c165',CAP='#3e5a5f';

const cam={...IN},camT={...cam};
function applyCam(){const sp=Math.sin(cam.pol);camera.position.set(cam.tx+cam.dist*sp*Math.sin(cam.az),cam.ty+cam.dist*Math.cos(cam.pol),cam.tz+cam.dist*sp*Math.cos(cam.az));
  if(VIEW==='in'){const c=camera.position;c.x=Math.max(1.5,Math.min(RW-1.5,c.x));c.z=Math.max(4,Math.min(RD+7,c.z));c.y=Math.max(4,Math.min(WALLH-1.2,c.y))}
  camera.lookAt(cam.tx,cam.ty,cam.tz)}
function setFov(){camera.fov=VIEW==='in'?Math.max(58,Math.min(78,2*Math.atan(Math.tan(.7)/camera.aspect)*180/Math.PI)):30;camera.updateProjectionMatrix()}
function overview(){Object.assign(camT,VIEW==='in'?IN:AER)}
function focusOn(p){const [x,z]=W(seatPt(p.id));
  if(VIEW==='in'){const r=SEAT[p.id].face==='right';Object.assign(camT,{tx:x+(r?1.5:.5),ty:4.5,tz:z+(r?.5:1.5),dist:27,az:r?1.15:.2,pol:1.06})}
  else Object.assign(camT,{tx:x+2,ty:3,tz:z+2,dist:52,az:.78,pol:.98})}
function resize(){if(!renderer)return;const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);renderer.domElement.style.width='100%';renderer.domElement.style.height='100%';camera.aspect=w/h;setFov();camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(stage);
/* drag to rotate, wheel to zoom */
let drag=null;const el=renderer?renderer.domElement:stage;
el.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,az:camT.az,pol:camT.pol,moved:false};el.setPointerCapture&&el.setPointerCapture(e.pointerId)});
el.addEventListener('pointermove',e=>{if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>4)drag.moved=true;if(drag.moved){if(VIEW==='in'){camT.az=Math.max(-.7,Math.min(1.45,drag.az-dx*.004));camT.pol=Math.max(1.02,Math.min(1.38,drag.pol-dy*.003))}else{camT.az=Math.max(.2,Math.min(1.35,drag.az-dx*.005));camT.pol=Math.max(.7,Math.min(1.15,drag.pol-dy*.004))}}return}
  hover=pick(e);el.style.cursor=hover?'pointer':'grab'});
el.addEventListener('pointerup',e=>{const d=drag;drag=null;if(d&&!d.moved){const p=pick(e);if(p)select(p);else closeCard()}});
el.addEventListener('wheel',e=>{e.preventDefault();camT.dist=VIEW==='in'?Math.max(12,Math.min(40,camT.dist*Math.exp(e.deltaY*.001))):Math.max(36,Math.min(130,camT.dist*Math.exp(e.deltaY*.001)))},{passive:false});
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
function pick(e){if(!renderer)return null;const r=el.getBoundingClientRect();mv.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mv,camera);
  const hits=ray.intersectObjects(P.map(p=>p.m.root),true);return hits.length?hits[0].object.userData.p||null:null}

/* ── DOM overlays: name tags, card ── */
const tagEls=P.map(p=>{const t=document.createElement('div');t.className='tag3';t.textContent=p.d.name;tagsBox.appendChild(t);return t});
const doorTag=document.createElement('div');doorTag.className='tag3 here';doorTag.textContent='你在這裡';tagsBox.appendChild(doorTag);
const v3=new THREE.Vector3();
function toScreen(x,y,z){v3.set(x,y,z).project(camera);return[(v3.x+1)/2*stage.clientWidth,(1-v3.y)/2*stage.clientHeight,v3.z]}
function headPos(p){const seated=p.state==='seat'&&!(p===openP||p.wave>0);const r=p.m.root.position;return[r.x,(seated?.45:0)+6.55*p.m.root.scale.y,r.z]}
const card=document.getElementById('card');
function placeOverlays(){P.forEach((p,i)=>{const [x,y]=toScreen(...headPos(p)),t=tagEls[i],hl=p===openP||p===hover;t.style.left=x+'px';t.style.top=y+'px';t.classList.toggle('on',hl);t.hidden=!(showTags||hl)||!p.m.root.visible});
  if(ROUTE.pts){const [dx,dz]=W(NODES.door),[x,y]=toScreen(dx,0,dz+2.4);doorTag.style.left=x+'px';doorTag.style.top=(y+34)+'px';doorTag.hidden=false}else doorTag.hidden=true;
}

/* ── portraits (rendered from the 3D models) ── */
const portraitURL={};
(function(){if(!renderer)return;try{const r2=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});r2.setSize(160,160);r2.outputEncoding=THREE.sRGBEncoding;
  const sc=new THREE.Scene();sc.add(new THREE.HemisphereLight('#fffaf0','#c9b49a',1));const dl=new THREE.DirectionalLight('#fff',.6);dl.position.set(3,6,8);sc.add(dl);
  const c2=new THREE.PerspectiveCamera(28,1,.1,100);c2.position.set(0,4.4,11);c2.lookAt(0,4.2,0);
  STAFF.forEach(d=>{const m=makeChar(d.look);sc.add(m.root);r2.render(sc,c2);portraitURL[d.id]=r2.domElement.toDataURL();sc.remove(m.root)});r2.dispose()}catch(e){}})();
function portrait(id,size){const im=document.createElement('img');im.src=portraitURL[id]||'';im.alt='';im.width=im.height=size;im.className='ptimg';return im}

function select(p){openP=p;document.getElementById('hint').hidden=true;goHome(p);ROUTE.pts=guidePath(p.id);ROUTE.t=0;buildRoute(ROUTE.pts);focusOn(p);
  const d=p.d;card.innerHTML=`<button class="x" type="button" aria-label="關閉">×</button><div class="top"><span class="pt"></span><div><div class="role">財務金融學系・${d.role}</div><div class="nm">${d.name}</div></div></div>
    <p class="way"><b>怎麼走：</b>${d.way}</p>
    <dl><dt>學歷</dt><dd>${d.edu}</dd><dt>電話</dt><dd>${d.tel}</dd><dt>傳真</dt><dd>${d.fax}</dd><dt>Email</dt><dd class="em">${d.mail}</dd></dl><button class="cp" type="button">複製 Email</button>`;
  card.querySelector('.pt').replaceWith(portrait(p.id,54));const pcb=document.querySelector(`.pc[data-id="${p.id}"]`);pcb.after(card);card.hidden=false;requestAnimationFrame(()=>card.scrollIntoView({block:'nearest',behavior:'smooth'}));card.querySelector('.x').onclick=closeCard;
  const cp=card.querySelector('.cp');cp.onclick=()=>{const sel=()=>{const r=document.createRange();r.selectNodeContents(card.querySelector('.em'));const s=getSelection();s.removeAllRanges();s.addRange(r);cp.textContent='已選取，請按 Ctrl+C 複製'};
    try{navigator.clipboard.writeText(d.mail).then(()=>{cp.textContent='已複製'},sel)}catch(_){sel()}};
  document.querySelectorAll('.pc').forEach(b=>b.classList.toggle('on',b.dataset.id===p.id));placeOverlays()}
function closeCard(){openP=null;card.hidden=true;P.forEach(q=>q.m.root.visible=true);ROUTE.pts=null;routeGroup.clear();overview();document.querySelectorAll('.pc').forEach(b=>b.classList.remove('on'))}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCard()});
const cards=document.getElementById('cards');
STAFF.forEach((d,i)=>{const b=document.createElement('button');b.type='button';b.className='pc';b.dataset.id=d.id;b.setAttribute('aria-label',`${d.role} ${d.name}，顯示座位路線與聯絡資訊`);
  b.appendChild(portrait(d.id,52));const t=document.createElement('span');t.innerHTML=`<b>${d.name}</b><small>${d.role}・分機 ${d.tel.split('分機 ')[1]}</small>`;b.appendChild(t);
  b.onclick=()=>{select(P[i]);if(matchMedia('(max-width:860px)').matches)stage.scrollIntoView({behavior:'smooth',block:'nearest'})};cards.insertBefore(b,card)});
document.getElementById('tagBtn').onclick=e=>{showTags=!showTags;e.currentTarget.setAttribute('aria-pressed',showTags)};
document.getElementById('playBtn').onclick=e=>{playing=!playing;e.currentTarget.textContent=playing?'暫停':'播放';e.currentTarget.setAttribute('aria-pressed',!playing)};
document.getElementById('homeBtn').onclick=closeCard;
function setView(v){VIEW=v;INNER.forEach(o=>o.visible=v==='in');const b=document.getElementById('viewBtn');b.textContent=v==='in'?'鳥瞰':'室內';b.setAttribute('aria-pressed',v!=='in');
  document.getElementById('homeBtn').textContent=v==='in'?'回門口':'看全景';setFov();if(openP){ROUTE.fol=0;focusOn(openP)}else overview()}
document.getElementById('viewBtn').onclick=()=>setView(VIEW==='in'?'aer':'in');

/* ── loop ── */
let last=0;
function loop(now){const dt=Math.min(.05,(now-(last||now))/1000);last=now;update(dt);
  const k=1-Math.exp(-dt*(reduce?20:3.2));for(const key of['tx','ty','tz','az','pol','dist'])cam[key]+=(camT[key]-cam[key])*k;
  if(VIEW==='in'&&openP&&ROUTE.pts){if(ROUTE.t<1){Object.assign(camT,{tx:headDot.position.x,ty:4,tz:headDot.position.z,dist:28,pol:1.08});camT.az+=(.35-camT.az)*k;ROUTE.fol=1}else if(ROUTE.fol){ROUTE.fol=0;focusOn(openP)}}
  else if(VIEW==='aer'&&openP&&openP.state!=='seat'){const r=openP.m.root.position;camT.tx=r.x+2;camT.tz=r.z+2}
  applyCam();
  if(VIEW==='in'&&openP){const A=camera.position,B=new THREE.Vector3(...headPos(openP)),AB=B.clone().sub(A),L2=AB.lengthSq();
    for(const q of P){if(q===openP){q.m.root.visible=true;continue}const H=new THREE.Vector3(...headPos(q)),t=H.clone().sub(A).dot(AB)/L2;
      const d=t>0&&t<.93?H.distanceTo(A.clone().addScaledVector(AB,t)):99;q.m.root.visible=d>4.6}
    for(const g of LAMPS){const H=g.position.clone().setY(WALLH-3),t=H.clone().sub(A).dot(AB)/L2;g.visible=!(t>0&&t<.95&&H.distanceTo(A.clone().addScaledVector(AB,t))<3.4)}}
  else if(P.some(q=>!q.m.root.visible)||LAMPS.some(g=>!g.visible&&VIEW==='in')){P.forEach(q=>q.m.root.visible=true);if(VIEW==='in')LAMPS.forEach(g=>g.visible=true)}
  for(const p of P){const seated=p.state==='seat'&&!(p===openP||p.wave>0),mov=p.state==='walk'&&playing;
    pose(p,p.m,seated,mov,p===openP||p.wave>0,dt,p===openP&&p.state==='seat');p.m.face.material=p.blinkT<0?p.m.fClosed:p.m.fOpen}
  for(const v of VIS)pose(v,v.m,false,v.state==='walk'&&playing,false,dt,false);
  BULBS.forEach((b,i)=>b.visible=(Math.floor(now/450)+i)%3!==0);
  routeTick();if(renderer)renderer.render(scene,camera);placeOverlays();requestAnimationFrame(loop)}
resize();requestAnimationFrame(loop);

</script>

</body></html>
