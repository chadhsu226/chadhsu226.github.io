<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教學小工具 | 許智翔</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        .serif { font-family: 'Noto Serif TC', serif; }
        .mono { font-family: 'DM Mono', monospace; }

        .tool-card { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .tool-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,0.10); }
        .tool-card:hover .cta { gap: 10px; }
        .cta { transition: gap 0.2s ease; }

        .back-home {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 0.85rem; color: #047857; text-decoration: none;
            opacity: 0.9; transition: opacity 0.15s, gap 0.15s;
        }
        .back-home:hover { opacity: 1; gap: 9px; }

        .pill {
            display: inline-block; font-size: 11px; padding: 3px 10px;
            border-radius: 20px; margin: 0 4px 4px 0;
        }

        /* 座位工具：迷你座位圖預覽 */
        .seat-preview {
            background: #f7f5f0; border: 1px solid #e0dbd3; border-radius: 10px;
            padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        .podium {
            background: #3d6b4f; color: #fff; font-size: 9px; letter-spacing: 1px;
            padding: 2px 14px; border-radius: 4px;
        }
        .seat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .seat-dot { width: 16px; height: 16px; border-radius: 4px; background: #eef6f1; border: 1px solid #cfe2d6; }
        .seat-dot.fixed { background: #fdf3ec; border-color: #e6c3a8; }

        /* 計時器工具：迷你投影畫面預覽 */
        .timer-preview {
            background: #0f1117; border: 1px solid #2a2d3e; border-radius: 10px;
            padding: 16px 14px; text-align: center;
        }
        .timer-preview .lbl { font-size: 9px; letter-spacing: 2px; color: rgba(240,242,248,0.45); text-transform: uppercase; }
        .timer-preview .big { font-size: 30px; font-weight: 300; color: #7b8cde; letter-spacing: 1px; line-height: 1.1; margin: 2px 0 8px; }
        .timer-preview .bar { height: 4px; border-radius: 2px; background: #2a2d3e; overflow: hidden; }
        .timer-preview .bar > span { display: block; height: 100%; width: 62%; background: #d4a017; border-radius: 2px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <header class="bg-white border-b border-gray-200 py-12">
        <div class="container mx-auto px-6 max-w-4xl">
            <a href="https://chadhsu226.github.io/" class="back-home mb-6">← 返回首頁</a>
            <div class="mt-5">
                <span class="inline-block text-xs font-medium tracking-widest text-emerald-700 bg-emerald-50 border border-emerald-100 px-3 py-1 rounded-full mb-3 mono">FOR TEACHERS</span>
                <h1 class="serif text-4xl font-bold text-gray-900 mb-2">教學小工具</h1>
                <p class="text-gray-500">課堂與考試實用工具 · 許智翔 · 銘傳大學財務金融系</p>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-6 py-12 max-w-4xl">
        <p class="text-sm text-gray-400 tracking-widest uppercase mb-6 mono">選擇工具</p>

        <div class="grid md:grid-cols-2 gap-8">

            <!-- 座位排列產生器 -->
            <a href="seat.html" class="tool-card block bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
                <div class="h-1.5 bg-emerald-600"></div>
                <div class="p-7">
                    <div class="seat-preview mb-6">
                        <div class="podium">講台</div>
                        <div class="seat-grid">
                            <span class="seat-dot"></span><span class="seat-dot fixed"></span><span class="seat-dot"></span><span class="seat-dot"></span><span class="seat-dot"></span>
                            <span class="seat-dot"></span><span class="seat-dot"></span><span class="seat-dot"></span><span class="seat-dot fixed"></span><span class="seat-dot"></span>
                            <span class="seat-dot"></span><span class="seat-dot"></span><span class="seat-dot"></span><span class="seat-dot"></span><span class="seat-dot"></span>
                        </div>
                    </div>
                    <h2 class="serif text-2xl font-semibold text-gray-900 mb-2">座位排列產生器</h2>
                    <p class="text-sm text-gray-500 leading-relaxed mb-4">
                        貼上學生名單即可隨機分配座位，支援指定固定座位、設定講台方向，並可直接拖曳微調個別位置。適合考試排座或分組。
                    </p>
                    <div class="mb-5">
                        <span class="pill" style="background:#e8f0eb;color:#3d6b4f;">隨機分配</span>
                        <span class="pill" style="background:#faf0ea;color:#b85c2a;">固定座位</span>
                        <span class="pill" style="background:#e8f0eb;color:#3d6b4f;">拖曳微調</span>
                    </div>
                    <span class="cta inline-flex items-center text-emerald-700 font-medium mono text-sm">開啟工具 &rarr;</span>
                </div>
            </a>

            <!-- 考試計時器 -->
            <a href="timer.html" class="tool-card block bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
                <div class="h-1.5" style="background:#7b8cde;"></div>
                <div class="p-7">
                    <div class="timer-preview mb-6">
                        <div class="lbl">剩餘時間</div>
                        <div class="big mono">25:00</div>
                        <div class="bar"><span></span></div>
                    </div>
                    <h2 class="serif text-2xl font-semibold text-gray-900 mb-2">考試計時器</h2>
                    <p class="text-sm text-gray-500 leading-relaxed mb-4">
                        考試倒數計時，可全螢幕投放至投影螢幕讓同學看時間。內建 30 / 10 / 5 分鐘分段顏色提醒，並支援深色與淺色模式切換。
                    </p>
                    <div class="mb-5">
                        <span class="pill" style="background:#eef0fb;color:#4a58c0;">倒數計時</span>
                        <span class="pill" style="background:#fbf3e0;color:#b07b00;">分段提醒</span>
                        <span class="pill" style="background:#eef0fb;color:#4a58c0;">可投影</span>
                    </div>
                    <span class="cta inline-flex items-center font-medium mono text-sm" style="color:#4a58c0;">開啟工具 &rarr;</span>
                </div>
            </a>

        </div>
    </main>

    <footer class="py-10 text-center text-gray-400 text-sm">
        &copy; 2026 Chih-Hsiang Hsu · 教學小工具
    </footer>

</body>
</html>
